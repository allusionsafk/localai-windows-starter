name: Adaptive Media 0.3.2 Dev

on:
  push:
    branches:
      - adaptive-media-dev
    paths:
      - adaptive-media/DEV-0.3.2
      - adaptive-media/Test-0.3.2-Hardware.ps1
      - adaptive-media/Test-0.3.2-Hardware.cmd
      - adaptive-media/Apply-0.3.2-Dev4.ps1
      - adaptive-media/Apply-0.3.2-Dev5.ps1
      - adaptive-media/Apply-0.3.2-Dev6.ps1
      - adaptive-media/Apply-0.3.2-Dev7.ps1

permissions:
  contents: read

jobs:
  build-test-dev:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Self-test hardware certification gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\adaptive-media\Test-0.3.2-Hardware.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Hardware certification gate self-test returned exit code $LASTEXITCODE" }

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Reconstruct reviewed source and apply 0.3.2 dev7 patch stack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mediaDir = Join-Path $env:GITHUB_WORKSPACE 'adaptive-media'
          $zipPath = Join-Path $env:RUNNER_TEMP 'AdaptiveMedia-0.3.0-Source.zip'
          $src = Join-Path $mediaDir 'source'
          $hashText = Get-Content (Join-Path $mediaDir 'AdaptiveMedia-0.3.0-Source.sha256.txt') -Raw
          $hashText = ($hashText -replace [char]0xFEFF, '').Trim()
          $expected = $hashText.Substring(0,64).ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw "Invalid stable source SHA-256 text: $expected" }
          $parts = @(Get-ChildItem -LiteralPath $mediaDir -Filter 'AdaptiveMedia-0.3.0-Source.part*.b64' -File | Sort-Object Name)
          if ($parts.Count -ne 5) { throw "Expected 5 stable source transport parts; found $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Stable source archive hash mismatch: expected=$expected actual=$actual" }
          Remove-Item -Recurse -Force $src -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $src -Force
          & (Join-Path $mediaDir 'Apply-Stable-Hotfix.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.1-Hotfix.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.2-Dev.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.2-Dev3.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.2-Dev4.ps1') -SourceRoot $src -CertificationRoot $mediaDir
          & (Join-Path $mediaDir 'Apply-0.3.2-Dev5.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.2-Dev6.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.2-Dev7.ps1') -SourceRoot $src
          Write-Host "Reviewed 0.3.0 source hash verified before patch stack: $actual"

      - name: Verify renderer, deterministic integration, and bundled certification assumptions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'adaptive-media\source'
          $confText = [IO.File]::ReadAllText((Join-Path $root 'payload\mpv-config\mpv.conf'))
          $engineText = [IO.File]::ReadAllText((Join-Path $root 'payload\AdaptiveMedia.Engine.ps1'))
          $backendText = [IO.File]::ReadAllText((Join-Path $root 'src\AdaptiveMedia.App\BackendBridge.cs'))
          $programText = [IO.File]::ReadAllText((Join-Path $root 'src\AdaptiveMedia.App\Program.cs'))
          $issText = [IO.File]::ReadAllText((Join-Path $root 'installer\AdaptiveMedia.iss'))
          $certPs1 = Join-Path $root 'payload\certification\Test-0.3.2-Hardware.ps1'
          $certCmd = Join-Path $root 'payload\certification\Test-0.3.2-Hardware.cmd'
          if ($confText -notmatch '(?ms)^\[compatibility\].*?gpu-api=d3d11.*?gpu-context=d3d11') { throw 'Compatibility profile is not explicitly D3D11.' }
          if ($confText -notmatch '(?ms)^\[nvidia\].*?gpu-api=vulkan.*?gpu-context=winvk') { throw 'NVIDIA profile is not explicitly Vulkan/winvk.' }
          if (([regex]::Matches($engineText, [regex]::Escape(".Add('--vulkan-swap-mode=fifo')"))).Count -ne 1) { throw 'FIFO must be added once at final renderer decision.' }
          if (([regex]::Matches($engineText, [regex]::Escape(".Add('--gpu-api=d3d11')"))).Count -ne 1) { throw 'RTX VPP gpu-api=d3d11 override missing or duplicated.' }
          if (([regex]::Matches($engineText, [regex]::Escape(".Add('--gpu-context=d3d11')"))).Count -ne 1) { throw 'RTX VPP gpu-context=d3d11 override missing or duplicated.' }
          if ($engineText -notmatch [regex]::Escape("`$MpvArgs.Contains('--profile=compatibility') -or `$MpvArgs.Contains('--gpu-api=d3d11') -or `$MpvArgs.Contains('--gpu-context=d3d11')")) { throw 'D3D11 FIFO guard missing.' }
          if (([regex]::Matches($engineText, 'ADAPTIVE_MEDIA_INTEGRATION_PROBE_JSON')).Count -ne 1) { throw 'Engine deterministic probe hook missing or duplicated.' }
          if (([regex]::Matches($engineText, 'ADAPTIVE_MEDIA_INTEGRATION_NVIDIA')).Count -ne 2) { throw 'Engine deterministic NVIDIA hooks missing or duplicated (expected the per-video hook plus the profile-decision hook).' }
          if (([regex]::Matches($backendText, 'ADAPTIVE_MEDIA_INTEGRATION_PROBE_JSON')).Count -ne 1) { throw 'BackendBridge deterministic probe handoff missing or duplicated.' }
          if (([regex]::Matches($backendText, 'ADAPTIVE_MEDIA_INTEGRATION_NVIDIA')).Count -ne 1) { throw 'BackendBridge deterministic NVIDIA handoff missing or duplicated.' }
          foreach ($needle in @('syntheticSdr1080Probe','new PlaybackOptions("Enhanced", "RtxVsr", "Smooth", false, true)','nvidia-true-hdr=yes','scaling-mode=nvidia')) {
            if (-not $programText.Contains($needle)) { throw "Deterministic RTX integration assertion missing: $needle" }
          }
          if (-not (Test-Path -LiteralPath $certPs1 -PathType Leaf) -or -not (Test-Path -LiteralPath $certCmd -PathType Leaf)) { throw 'Bundled hardware certification files are missing from payload.' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $certPs1).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'adaptive-media\Test-0.3.2-Hardware.ps1')).Hash) { throw 'Bundled certification PS1 differs from reviewed repository copy.' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $certCmd).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'adaptive-media\Test-0.3.2-Hardware.cmd')).Hash) { throw 'Bundled certification CMD differs from reviewed repository copy.' }
          if (-not $issText.Contains('Run objective 0.3.2 hardware certification')) { throw 'Dev4 installer does not expose the post-install certification run.' }
          $apiIndex = $engineText.IndexOf("`$MpvArgs.Add('--gpu-api=d3d11')")
          $contextIndex = $engineText.IndexOf("`$MpvArgs.Add('--gpu-context=d3d11')")
          $fifoDecisionIndex = $engineText.IndexOf('$finalUsesD3d11 =')
          if ($apiIndex -lt 0 -or $contextIndex -le $apiIndex -or $fifoDecisionIndex -le $contextIndex) { throw 'RTX D3D11 pairing/final FIFO ordering is invalid.' }
          if ($engineText -match [regex]::Escape("if (Test-NvidiaGpuPresent -and")) { throw 'A command-mode NVIDIA guard remains; the Compatibility escape hatch would silently inherit --profile=nvidia.' }
          if (([regex]::Matches($engineText, [regex]::Escape("if ((Test-NvidiaGpuPresent) -and `$profile -ne 'compatibility') {"))).Count -ne 1) { throw 'Interactive NVIDIA profile guard missing or duplicated.' }
          if (([regex]::Matches($engineText, [regex]::Escape("if (((Test-NvidiaGpuPresent) -or `$integrationNvidiaProfile) -and `$profile -ne 'compatibility')"))).Count -ne 1) { throw 'Headless NVIDIA profile guard missing or duplicated.' }
          foreach ($needle in @('compatibilityOnNvidia','enhancedOnNvidia','return 27;','return 28;')) {
            if (-not $programText.Contains($needle)) { throw "Compatibility renderer regression coverage missing: $needle" }
          }
          if (([regex]::Matches($programText, [regex]::Escape('integrationNvidia: true'))).Count -ne 3) { throw 'Expected exactly three simulated-NVIDIA integration plans.' }
          $certText = [IO.File]::ReadAllText($certPs1)
          foreach ($needle in @(
            'function Get-PlannedMpvArguments',
            'function ConvertTo-OptionText',
            'Planned mpv launch vector has {0} argument(s)',
            'Launch vector did not survive command-line quoting',
            'mpv option normalisation returned'
          )) { if (-not $certText.Contains($needle)) { throw "Repaired hardware gate is missing required content: $needle" } }
          if ($certText.Contains("        '--input-ipc-server=' + `$PipePath,")) { throw 'The collapsed certification launch vector has returned; the injected IPC options would be one argument.' }
          foreach ($stale in @("[string]`$api.Value -ne 'vulkan'", "[string]`$context.Value -ne 'winvk'", "[string]`$swap.Value -ne 'fifo'")) {
            if ($certText.Contains($stale)) { throw "The hardware gate still string-compares a structured mpv option value: $stale" }
          }
          if (([regex]::Matches($certText, [regex]::Escape('[AdaptiveMediaHardwareNative]::Join($arguments)'))).Count -ne 1) { throw 'Start-PlannedMpv no longer joins a single strongly typed argument vector.' }
          Write-Host 'Renderer-aware motion + deterministic RTX integration + bundled certification assumptions: PASS'
          Write-Host 'Repaired hardware certification instrument (launch vector + option normalisation): PASS'
          $guardCond = 'profile-cond=(p.time_pos or 0) > 5 and (p.vsync_jitter or 0) > 0.1 and (p.vo_delayed_frame_count or 0) > 2 * (p.time_pos or 1)'
          if (-not $confText.Contains('[motion-guard]')) { throw 'Managed mpv config is missing the automatic motion fallback profile.' }
          if (-not $confText.Contains($guardCond)) { throw 'The motion guard condition is not the reviewed, measured one.' }
          if ($confText -notmatch '(?ms)^\[motion-guard\].*?video-sync=audio.*?interpolation=no') { throw 'The motion guard does not fall back to native cadence.' }
          if (([regex]::Matches($confText, [regex]::Escape('[motion-guard]'))).Count -ne 1) { throw 'Motion guard profile duplicated.' }
          if (([regex]::Matches($confText, [regex]::Escape('profile-cond='))).Count -ne 1) { throw 'Exactly one conditional auto profile is expected in the managed mpv config.' }
          if ($engineText.Contains('--profile=motion-guard')) { throw 'The engine must not request the motion guard explicitly; that would apply it unconditionally and disable smooth motion everywhere.' }
          foreach ($needle in @('function Get-DisplaySyncVerdict','MotionGuardEngaged','MotionGuardJitterThreshold','Motion guard engaged')) {
            if (-not $certText.Contains($needle)) { throw "The hardware gate does not understand the motion guard: $needle" }
          }
          if ($certText.Contains("elseif (-not [bool]`$sync.Value) { Add-Item `$fail 'mpv reports display-sync-active=false.' }")) { throw 'The hardware gate still fails unconditionally on inactive display sync and would reject a correct automatic fallback.' }
          Write-Host 'Automatic motion fallback + gate awareness: PASS'
          Write-Host 'Compatibility D3D11 escape hatch guard + deterministic NVIDIA-profile coverage: PASS'

      - name: Build and isolated smoke-test 0.3.2-dev7
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'adaptive-media\source')
          try {
            .\scripts\Build-Dev.ps1 -Clean -SmokeTest
            if ($LASTEXITCODE -ne 0) { throw "Build-Dev returned exit code $LASTEXITCODE" }
          } catch {
            $devError = Join-Path $env:TEMP 'AdaptiveMedia-0.3.2-integration-error.txt'
            if (Test-Path -LiteralPath $devError) {
              Write-Host '--- 0.3.2 integration exception ---'
              Write-Host (Get-Content -LiteralPath $devError -Raw)
              Write-Host '--- end integration exception ---'
            }
            throw
          }

      - name: Verify 0.3.2-dev7 candidate
        id: artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'adaptive-media\source'
          $dist = Join-Path $root 'dist'
          $installer = Join-Path $dist 'AdaptiveMediaSetup-0.3.2-dev7-x64.exe'
          $engine = Join-Path $root 'payload\AdaptiveMedia.Engine.ps1'
          $input = Join-Path $root 'payload\mpv-config\input.conf'
          $program = Join-Path $root 'src\AdaptiveMedia.App\Program.cs'
          $stageCertPs1 = Join-Path $root 'build\staging\certification\Test-0.3.2-Hardware.ps1'
          $stageCertCmd = Join-Path $root 'build\staging\certification\Test-0.3.2-Hardware.cmd'
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Expected 0.3.2-dev7 installer was not produced.' }
          if (-not (Test-Path -LiteralPath $stageCertPs1 -PathType Leaf) -or -not (Test-Path -LiteralPath $stageCertCmd -PathType Leaf)) { throw 'Staged hardware certification files are missing.' }
          $engineText = [IO.File]::ReadAllText($engine)
          $inputText = [IO.File]::ReadAllText($input)
          $programText = [IO.File]::ReadAllText($program)
          if (([regex]::Matches($engineText, [regex]::Escape('--vulkan-swap-mode=fifo'))).Count -ne 1) { throw 'Renderer-aware FIFO implementation must have one final add site.' }
          if ($inputText -notmatch '(?m)^ESC\s+set\s+fullscreen\s+no\s*$') { throw 'Managed ESC fullscreen binding missing.' }
          if ($inputText -match '(?im)^\s*ESC\s+.*\bquit(?:-watch-later)?\b') { throw 'ESC quit binding remains.' }
          foreach ($needle in @(
            'new PlaybackOptions("Compatibility", "Off", "Smooth", false, false)',
            'Has(compatibilitySmooth, "--vulkan-swap-mode=fifo")',
            'syntheticSdr1080Probe',
            '!Has(rtx, "--gpu-api=d3d11")',
            '!Has(rtx, "--gpu-context=d3d11")',
            'Has(rtx, "--vulkan-swap-mode=fifo")',
            'scaling-mode=nvidia',
            'nvidia-true-hdr=yes'
          )) { if (-not $programText.Contains($needle)) { throw "Integration coverage missing: $needle" } }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToUpperInvariant()
          "$hash  AdaptiveMediaSetup-0.3.2-dev7-x64.exe" | Set-Content -LiteralPath (Join-Path $dist 'AdaptiveMediaSetup-0.3.2-dev7-x64.sha256.txt') -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "0.3.2-dev7 candidate SHA-256: $hash"

      - name: Upload private dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveMedia-0.3.2-dev7-x64
          path: |
            adaptive-media/source/dist/AdaptiveMediaSetup-0.3.2-dev7-x64.exe
            adaptive-media/source/dist/AdaptiveMediaSetup-0.3.2-dev7-x64.sha256.txt
          if-no-files-found: error
          retention-days: 14
