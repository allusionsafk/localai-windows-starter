name: Adaptive Media 0.3.2 Motion Inspect

on:
  push:
    branches:
      - adaptive-media-dev
    paths:
      - adaptive-media/DEV-0.3.2-MOTION-INSPECT

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct reviewed source and patch stack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mediaDir = Join-Path $env:GITHUB_WORKSPACE 'adaptive-media'
          $zipPath = Join-Path $env:RUNNER_TEMP 'AdaptiveMedia-0.3.0-Source.zip'
          $src = Join-Path $mediaDir 'source'
          $hashText = (Get-Content (Join-Path $mediaDir 'AdaptiveMedia-0.3.0-Source.sha256.txt') -Raw).Trim()
          $expected = (($hashText -replace [char]0xFEFF, '').Trim()).Substring(0,64).ToLowerInvariant()
          $parts = @(Get-ChildItem -LiteralPath $mediaDir -Filter 'AdaptiveMedia-0.3.0-Source.part*.b64' -File | Sort-Object Name)
          if ($parts.Count -ne 5) { throw "Expected 5 source parts; found $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded))
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant() -ne $expected) { throw 'Source archive hash mismatch.' }
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $src -Force
          & (Join-Path $mediaDir 'Apply-Stable-Hotfix.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.1-Hotfix.ps1') -SourceRoot $src
          & (Join-Path $mediaDir 'Apply-0.3.2-Dev.ps1') -SourceRoot $src
      - name: Print headless probe and backend handoff context
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'adaptive-media\source'
          $engine = Join-Path $root 'payload\AdaptiveMedia.Engine.ps1'
          $backend = Join-Path $root 'src\AdaptiveMedia.App\BackendBridge.cs'
          $program = Join-Path $root 'src\AdaptiveMedia.App\Program.cs'
          Write-Host '===== ENGINE 930-1035 ====='
          $lines = Get-Content -LiteralPath $engine
          for ($i = 930; $i -le [Math]::Min(1035, $lines.Count); $i++) { '{0,4}: {1}' -f $i, $lines[$i-1] }
          Write-Host '===== BACKEND BRIDGE ====='
          Get-Content -LiteralPath $backend
          Write-Host '===== PROGRAM INTEGRATION ====='
          Get-Content -LiteralPath $program
