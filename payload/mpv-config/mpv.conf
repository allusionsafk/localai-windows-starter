# Adaptive Media v0.1 - isolated mpv configuration
# Reference-first playback for Windows 10/11.

vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=auto-safe

target-colorspace-hint=auto
target-colorspace-hint-mode=target
target-peak=auto

scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
scale-antiring=0.6
cscale-antiring=0.6
sigmoid-upscaling=yes
correct-downscaling=yes
linear-downscaling=yes

deband=no
video-sync=display-resample
interpolation=no

audio-channels=auto-safe
audio-spdif=
alang=eng,en,jpn,ja,ben,bn,und

slang=eng,en,eng-forced,en-forced,forced
sub-auto=fuzzy
embeddedfonts=yes
sub-fix-timing=yes

osc=yes
osd-level=1
keep-open=yes
save-position-on-quit=yes
watch-later-options=start
border=yes
cache=yes
cache-pause=no
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
screenshot-format=png
screenshot-high-bit-depth=yes

[reference]
deband=no
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

[enhanced]
deband=yes
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=24
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

[compatibility]
vo=gpu
gpu-api=d3d11
hwdec=auto-safe
scale=bilinear
cscale=bilinear
dscale=bilinear
deband=no
video-sync=audio
audio-spdif=

[battery]
hwdec=auto-safe
scale=bilinear
cscale=bilinear
dscale=bilinear
deband=no

[pcm-safe]
audio-spdif=
audio-channels=auto-safe

[hdmi-bitstream]
audio-spdif=ac3,eac3,dts,dts-hd,truehd
audio-channels=auto-safe
