# Adaptive Media 0.4.0-rc1 - managed mpv defaults
vo=gpu-next
gpu-api=vulkan
keep-open=no
force-window=yes
term-osd-bar=no
osd-on-seek=bar
video-sync=audio
interpolation=no
deband=no
sigmoid-upscaling=no
scale=spline36
cscale=spline36
dscale=mitchell
hwdec=auto-safe

[automatic]
profile-desc=Conservative automatic reference-first playback
video-sync=audio
interpolation=no
deband=no

[reference]
profile-desc=Reference playback: preserve source cadence and colour intent
video-sync=audio
interpolation=no
deband=no
sigmoid-upscaling=no

[enhanced]
profile-desc=Enhanced base profile; per-video changes are appended explicitly by Adaptive Media
video-sync=audio
interpolation=no
deband=no

[compatibility]
profile-desc=Compatibility path for difficult Windows systems
gpu-api=d3d11
gpu-context=d3d11
hwdec=d3d11va-copy,auto-safe
video-sync=audio
interpolation=no
deband=no

[nvidia]
profile-desc=NVIDIA reference acceleration validated on hybrid laptop hardware
gpu-api=vulkan
gpu-context=winvk
hwdec=nvdec,auto-safe

[pcm-safe]
profile-desc=Decode audio to PCM; safest default for laptop/TV/Bluetooth/USB audio
audio-spdif=

[hdmi-bitstream]
profile-desc=Optional compressed HDMI bitstream
audio-spdif=ac3,eac3,dts,dts-hd,truehd

# Automatic motion fallback - see the Adaptive Media 0.3.2 release notes.
# Applied by mpv automatically as a conditional auto profile; it must not be
# requested with --profile, which would apply it unconditionally.
[motion-guard]
profile-desc=Fall back from display-synchronised motion when the display cannot present at a stable rate
profile-cond=(p.time_pos or 0) > 5 and (p.vsync_jitter or 0) > 0.1 and (p.vo_delayed_frame_count or 0) > 2 * (p.time_pos or 1)
video-sync=audio
interpolation=no